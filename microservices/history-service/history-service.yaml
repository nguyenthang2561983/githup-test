apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-service
  namespace: fibervnn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history-service
  template:
    metadata:
      labels:
        app: history-service
    spec:
      containers:
        - name: history-service
          image: fibervnn-subscriber-management-history-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://fibervnn-postgres:5432/history_db
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fibervnn-secrets
                  key: postgres-password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092

---
apiVersion: v1
kind: Service
metadata:
  name: history-service
  namespace: fibervnn
spec:
  selector:
    app: history-service
  ports:
    - port: 8085
      targetPort: 8085
